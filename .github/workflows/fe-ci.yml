name: NexRead FE CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: FE quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: next-read-app
    env:
      NEXT_PUBLIC_API_BASE_URL: https://crack-be-ai-novanx-staging.up.railway.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: next-read-app/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-test-reports
          path: |
            next-read-app/coverage
            next-read-app/playwright-report
            next-read-app/test-results
          if-no-files-found: ignore
